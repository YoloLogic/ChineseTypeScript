# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json

version: '2'

run:
  allow-parallel-runners: true

linters:
  default: none
  enable:
    # Enabled
    - asasalint
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - customlint
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forbidigo
    - gocheckcompilerdirectives
    - goprintffuncname
    - govet
    - grouper
    - inamedparam
    - ineffassign
    - intrange
    - makezero
    - mirror
    - misspell
    - modernize
    - musttag
    - nakedret
    - nolintlint
    - paralleltest
    - perfsprint
    - predeclared
    - reassign
    - testableexamples
    - tparallel
    - unconvert
    - usestdlibvars
    - usetesting

    # Need to add headers
    # - goheader

    # Check
    # - exhaustive
    # - gocritic
    # - gosec
    # - revive
    # - staticcheck
    # - testifylint
    # - unparam
    # - unused

  settings:
    custom:
      customlint:
        type: module

    modernize:
      disable:
        - slicesbackward # https://github.com/golang/go/issues/78829

    depguard:
      rules:
        main:
          deny:
            - pkg: 'encoding/json$'
              desc: 'Use "github.com/microsoft/TypeScript/tsc/internal/json" instead.'
            - pkg: 'github.com/go-json-experiment/json'
              desc: 'Use "github.com/microsoft/TypeScript/tsc/internal/json" instead.'

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '.*'
          msg: tspath should likely be used instead
          pkg: ^(path|path/filepath)$
        - pattern: '.*'
          msg: a host implementation should likely be used instead
          pkg: ^os(/|$)
        - pattern: 'GOOS'
          msg: a host implementation should likely be used instead
          pkg: ^runtime$

  exclusions:
    rules:
      - path: internal/fourslash/tests/
        linters:
          - misspell
      - path: 'internal/(repo|testutil|testrunner|vfs|pprof|execute/tsctests|bundled|fswatch|nativepath|osutil)|cmd/tsc'
        text: should likely be used instead
      - path: '(.+)_test\.go$'
        text: should likely be used instead
      - path: 'tools'
        text: should likely be used instead
      # cmd/genzhkeywords 是本项目自己的【独立代码生成器】:它的职责就是读上游源码、
      # 写出汉语关键字表,因此不走上游的 host 抽象层(那里禁 os.ReadFile/WriteFile 等)。
      # 与上游对 tools/ 的豁免同一性质 —— 只豁免 forbidigo 这一条文案,别的规则照旧。
      - path: 'cmd/genzhkeywords'
        text: should likely be used instead

    presets:
      - comments
      - std-error-handling

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
