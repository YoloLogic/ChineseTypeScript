name: CI

on:
  push:
    branches: [main, main-ts7, ts7-release, 'release-*']
  pull_request:
    branches: [main, main-ts7, ts7-release, 'release-*']
  merge_group:
    branches: [main, main-ts7, ts7-release, 'release-*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby build
      - run: npx hereby build:api

  # ==========================================================================
  # 本项目自有的判定 job（只增不改，2026-10-10 起）。
  #
  # 为什么需要它：上游的 test / test-extra 里那些 fourslash 补全期望与 baseline，
  # 因为我们【故意】加入了汉语关键字、汉语补全、汉语标准库增补而必然不同（见
  # stdlib/规模化方案.md 六·十三），于是长期是红的。这里单独跑【本项目自己的判据】：
  # 它们才是这个分支真正要守的东西。
  #
  # 只跑【不依赖上游基线 tsc】的判据（judge_chts / judge_oss 需要 ../cts-base，留给本地与
  # 后续的“clone 上游基线”步骤）。
  # ==========================================================================
  zh-judges:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - name: 装 pandoc（仅 ubuntu，教程 docx 校验要用）
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: 构建 chtsc
        shell: bash
        run: |
          cd tsc
          go build -o "$RUNNER_TEMP/chtsc" ./cmd/tsc
      - name: 跑本项目判据（汉语标准库 / 关键字作用域 / 中文诊断 / 语言服务 / 教程 / 许可 / 项目）
        shell: pwsh
        env:
          CHTSC: ${{ runner.temp }}/chtsc
        # 逐个跑并【汇总】结果：以前是顺序调用，某一条失败会被后面的成功掩盖
        # （PowerShell 的 step 退出码只取最后一条命令），也会让失败原因不可见。
        # 失败原因要能【立刻】看到：job 日志要等整个 run 结束才放出，而 step summary
        # 在 job 一结束就可见。所以每条判据的输出都同时写进 GITHUB_STEP_SUMMARY。
        run: |
          $judges = @('zhstdlib','kwscope','zhdiag','langservice','tutorial','proj')
          $failed = @()
          $summary = $env:GITHUB_STEP_SUMMARY
          function Note([string]$s) { if ($summary) { Add-Content -Path $summary -Value $s -Encoding UTF8 } }
          Note ('## zh-judges（' + $env:RUNNER_OS + '）' + "`n")
          foreach ($j in $judges) {
            $out = pwsh -NoProfile -File "./tests-chts/judge_$j.ps1" -NoBuild *>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out
            Write-Host "---> judge_$j 退出码=$code"
            Note ('- judge_' + $j + ' 退出码=' + $code)
            if ($code -ne 0) {
              # workflow 命令 → check-run annotation：日志要等整个 run 结束才放出，
              # annotation 用 gh api .../check-runs/{id}/annotations 随时能读。
              Write-Host ("::error title=judge_" + $j + " 失败::judge_" + $j + " 退出码=" + $code)
              $failed += $j
              Note ('<details><summary>judge_' + $j + ' 输出（失败）</summary>' + "`n`n" + '```' + "`n" + $out + '```' + "`n</details>")
            }
          }
          $outLic = pwsh -NoProfile -File ./tests-chts/judge_licenses.ps1 *>&1 | Out-String
          Write-Host $outLic
          Note ('- judge_licenses 退出码=' + $LASTEXITCODE)
          if ($LASTEXITCODE -ne 0) { $failed += 'licenses' }
          if ($failed.Count -gt 0) {
            Write-Host ("::error title=失败判据::失败判据: " + ($failed -join ', '))
            Note ("`n**失败判据: " + ($failed -join ', ') + "**")
            Write-Host ("失败判据: " + ($failed -join ', '))
            exit 1
          }
          Note "`n全部判据通过"
          Write-Host '全部判据通过'
  release-build:
    if: ${{ github.repository == 'microsoft/TypeScript' && github.event_name != 'merge_group' }}
    runs-on: TypeScript-1ES-GitHub-TypeScript-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby typescript:release --forRelease --setPrerelease dev.0.0

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm run extension:build

  package-feed-proxy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          package-manager-cache: false
      - run: npm ci --registry=https://packagefeedproxy.microsoft.io/npm/

  test:
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        config:
          - runner: ubuntu-latest
            os: linux
            coverage: true
            main: true
          - runner: windows-latest
            os: windows
            coverage: true
            skip: ${{ github.event_name == 'merge_group' }}
          - runner: macos-latest
            os: macos
            coverage: true
            skip: ${{ github.event_name == 'merge_group' || github.event_name == 'pull_request' }}
          - runner: TypeScript-1ES-GitHub-TypeScript-1
            os: linux
            name: 'race mode'
            race: true
            skip: ${{ github.event_name == 'merge_group' || github.repository != 'microsoft/TypeScript' }}
          - runner: ubuntu-latest
            os: linux
            name: 'noembed'
            noembed: true
          - runner: ubuntu-latest
            os: linux
            name: 'concurrent test programs'
            concurrent-test-programs: true
            coverage: true
            skip: ${{ github.event_name == 'merge_group' }}
        exclude:
          - config:
              skip: true

    name: test (${{ matrix.config.name || matrix.config.runner }})
    runs-on: ${{ matrix.config.runner }}
    permissions:
      id-token: write
      contents: read
    env:
      TSGO_HEREBY_RACE: ${{ (matrix.config.race && 'true') || 'false' }}
      TSGO_HEREBY_NOEMBED: ${{ (matrix.config.noembed && 'true') || 'false' }}
      TSGO_HEREBY_CONCURRENT_TEST_PROGRAMS: ${{ (matrix.config.concurrent-test-programs && 'true') || 'false' }}
      TSGO_HEREBY_COVERAGE: ${{ (matrix.config.coverage && github.event_name != 'merge_group' && 'true') || 'false' }}
    steps:
      - run: git config --system core.longpaths true
        if: ${{ matrix.config.os == 'windows' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - if: ${{ !matrix.config.main }}
        name: Disable PR annotations
        run: |
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=go::"
      - run: npm ci
      - run: go install gotest.tools/gotestsum@latest
        if: ${{ matrix.config.os != 'windows' && !matrix.config.race }}
      - name: Tests
        id: test
        run: npx hereby test:tsc
      - name: Benchmarks
        run: npx hereby test:benchmarks
      - run: git add .
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ always() && matrix.config.coverage && github.event_name != 'merge_group' }}
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          name: ${{ matrix.config.name || matrix.config.runner }}
          directory: ./coverage
      - run: git diff --staged --exit-code --stat
      - name: Print baseline diff on failure
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        run: |
          npx hereby baseline-accept
          git add tsc/testdata/baselines/reference
          git diff --staged --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.test.conclusion == 'failure' }}
        with:
          name: ${{ matrix.config.name || matrix.config.os }}-new-baselines
          path: tsc/testdata/baselines/local

  test-extra:
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        config:
          - runner: ubuntu-latest
            os: linux
            coverage: true
            main: true
          - runner: windows-latest
            os: windows
            coverage: true
            skip: ${{ github.event_name == 'merge_group' }}
          - runner: macos-latest
            os: macos
            coverage: true
            skip: ${{ github.event_name == 'merge_group' || github.event_name == 'pull_request' }}
        exclude:
          - config:
              skip: true

    name: test extra (${{ matrix.config.runner }})
    runs-on: ${{ matrix.config.runner }}
    permissions:
      id-token: write
      contents: read
    env:
      TSGO_HEREBY_COVERAGE: ${{ (matrix.config.coverage && github.event_name != 'merge_group' && 'true') || 'false' }}
    steps:
      - run: git config --system core.longpaths true
        if: ${{ matrix.config.os == 'windows' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - if: ${{ !matrix.config.main }}
        name: Disable PR annotations
        run: |
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=go::"
      - run: npm ci
      - run: go install gotest.tools/gotestsum@latest
        if: ${{ matrix.config.os != 'windows' }}
      - run: npx hereby test:extension
      - run: npx hereby test:tools
      - run: npx hereby test:api
      - run: git add .
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        if: ${{ always() && matrix.config.coverage && github.event_name != 'merge_group' }}
        with:
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          name: extra-${{ matrix.config.runner }}
          directory: ./coverage
      - run: git diff --staged --exit-code --stat

  lint:
    strategy:
      fail-fast: ${{ github.event_name == 'merge_group' }}
      matrix:
        config:
          - runner: ubuntu-latest
            os: linux
            main: true
          - runner: windows-latest
            os: windows
            skip: ${{ github.event_name == 'merge_group' }}
          - runner: ubuntu-latest
            os: linux
            name: 'noembed'
            noembed: true
            skip: ${{ github.event_name == 'merge_group' }}
        exclude:
          - config:
              skip: true
    name: lint (${{ matrix.config.name || matrix.config.runner }})
    runs-on: ${{ matrix.config.runner }}
    env:
      TSGO_HEREBY_NOEMBED: ${{ (matrix.config.noembed && 'true') || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - if: ${{ !matrix.config.main }}
        name: Disable PR annotations
        run: |
          echo "::remove-matcher owner=eslint-compact::"
          echo "::remove-matcher owner=eslint-stylish::"
          echo "::remove-matcher owner=tsc::"
          echo "::remove-matcher owner=go::"
      - run: npm ci
      - run: npx hereby lint

  format:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby check:format

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '>=22.16.0'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby generate
      - run: npx hereby generate:enums
      - run: npx hereby generate:ast
      - run: npx hereby generate:vendor
      - run: node --experimental-strip-types ./tsc/internal/lsp/lsproto/_generate/fetchModel.mts
      - run: node --experimental-strip-types ./tsc/internal/lsp/lsproto/_generate/generate.mts
      - run: npx hereby generate:extension
      - run: npx hereby check:scripts
      - run: git add .
      - run: git diff --staged --exit-code --stat

  tidy:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go
      - run: go -C ./tsc mod tidy -diff
      - run: go -C ./tools mod tidy -diff
      - run: go work sync
      - run: git diff --exit-code

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: npx hereby build --race
      - run: ./built/local/tsc -p ./tsc/testdata/fixtures/compiler --noEmit --singleThreaded
      - run: ./built/local/tsc -p ./tsc/testdata/fixtures/compiler --noEmit

  misc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
      - uses: ./.github/actions/setup-go
      - run: npm ci
      - run: go -C ./tools run ./cmd/checkmodpaths "$PWD"
      - run: npx hereby check:scripts
      - run: npx hereby typescript:check-platforms

  required:
    runs-on: ubuntu-slim
    if: ${{ always() }}
    needs:
      - build
      - release-build
      - extension
      - format
      - generate
      - lint
      - misc
      - package-feed-proxy
      - smoke
      - test
      - test-extra
      - tidy
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          ! echo "$NEEDS" | jq -e 'to_entries[] | { job: .key, result: .value.result } | select((.result == "success" or .result == "skipped") | not)'
